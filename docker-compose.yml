# ISP-Flow — PostgreSQL + API (Node/Express/Sequelize) + Nginx (web app, proxies /api and /socket.io)
#
#   cp .env.docker.example .env      # set the passwords and secret
#   docker compose up -d --build
#   open http://localhost:2000       (API docs: http://localhost:2000/api/docs)
#
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: isp_flow
      POSTGRES_USER: ${POSTGRES_USER:-ispflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Asia/Kolkata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ispflow} -d isp_flow"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./Web/backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-ispflow}:${POSTGRES_PASSWORD}@db:5432/isp_flow
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CLIENT_URL: ${PUBLIC_URL:-http://localhost:2000}
      PLATFORM_OWNER_NAME: ${PLATFORM_OWNER_NAME:-Platform Admin}
      PLATFORM_OWNER_EMAIL: ${PLATFORM_OWNER_EMAIL:?Set PLATFORM_OWNER_EMAIL in .env}
      PLATFORM_OWNER_PASSWORD: ${PLATFORM_OWNER_PASSWORD:?Set PLATFORM_OWNER_PASSWORD in .env}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      BILLING_SCHEDULER_MINUTES: ${BILLING_SCHEDULER_MINUTES:-360}
      APP_TIMEZONE: Asia/Kolkata
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads:/app/uploads
    expose:
      - "4000"

  web:
    build: ./Web/frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-2000}:80"

volumes:
  pgdata:
  uploads:
